apiVersion: apps/v1
kind: Deployment
metadata:
  name: stateforge-kestrel
  labels:
    app.kubernetes.io/name: stateforge
    app.kubernetes.io/component: kestrel
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stateforge
      app.kubernetes.io/component: kestrel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stateforge
        app.kubernetes.io/component: kestrel
        app.kubernetes.io/version: "1.0.0"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stateforge-kestrel
          image: stateforge-kestrel:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: stateforge-config
            - secretRef:
                name: stateforge-secret
                optional: true
          volumeMounts:
            - name: stateforge-data
              mountPath: /data/stateforge
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: stateforge-data
          persistentVolumeClaim:
            claimName: stateforge-data
