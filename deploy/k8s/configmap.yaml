apiVersion: v1
kind: ConfigMap
metadata:
  name: stateforge-config
data:
  STATEFORGE_ROOT_PATH: "/data/stateforge"
  STATEFORGE_COMPRESSION: "true"
  STATEFORGE_ENCRYPTION: "true"
  STATEFORGE_PROTECTION_MODE: "aes"
  STATEFORGE_KEEP_BACKUPS: "false"
  STATEFORGE_SHARD_DEPTH: "1"
  STATEFORGE_STALE_LOCK_MINUTES: "5"
